# ══════════════════════════════════════════════════════════════════════════════
# GOTTI ECOSYSTEM — MASTER DOCKER COMPOSE
# Storage & Volumes: All containers mapped to D:\Miltiadis\Database
# Services:
#   1. mysql           (MySQL 8.0 Engine & 16 Tables)                  [Port 3306]
#   2. gotti-backend   (FastAPI Primary Entry Point & Fund Accounting) [Port 10000]
#   3. stock-alchemist (News, Sentiment & Signal Engine)               [Port 8080]
#   4. gotti-visualize (Chart API, S/R, Fibonacci & Lumibot Runner)    [Port 8000]
#   5. gotti-frontend  (Next.js Client Web Dashboard)                 [Port 3000]
# ══════════════════════════════════════════════════════════════════════════════

services:

  # ── 1. Shared MySQL 8.0 Database (All data on D:\Miltiadis\Database) ────────
  mysql:
    image: mysql:8.0
    container_name: gotti-mysql
    restart: unless-stopped
    command: --default-authentication-plugin=mysql_native_password
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-1234}
      MYSQL_DATABASE: ${DB_DATABASE:-gotti}
    ports:
      - "3306:3306"
    volumes:
      - "D:/Miltiadis/Database:/var/lib/mysql"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${DB_PASSWORD:-1234}"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - gotti-net

  # ── 2. Gotti Backend (Primary Entry Point & Fund Accounting) ────────────────
  gotti-backend:
    build:
      context: ../gotti-backend
      dockerfile: Dockerfile
    container_name: gotti-backend-api
    restart: unless-stopped
    env_file:
      - ../gotti-backend/.env
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "10000:10000"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:10000/health"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 15s
    volumes:
      - "D:/Miltiadis/Database/backend/logs:/app/logs"
    networks:
      - gotti-net

  # ── 3. Stock Alchemist (News, Sentiment & Signal Coordinator) ───────────────
  stock-alchemist:
    build:
      context: ../stock-alchemist
      dockerfile: Dockerfile
    container_name: stock-alchemist-app
    restart: unless-stopped
    env_file:
      - ../stock-alchemist/.env
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/health"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 20s
    volumes:
      - "D:/Miltiadis/Database/stock-alchemist/database:/app/database"
      - "D:/Miltiadis/Database/stock-alchemist/logs:/app/logs"
    networks:
      - gotti-net

  # ── 4. Gotti Visualize (FastAPI Charts & Strategy Execution) ────────────────
  gotti-visualize:
    build:
      context: ../gotti-visualize
      dockerfile: Dockerfile
    container_name: gotti-visualize-api
    restart: unless-stopped
    env_file:
      - ../gotti-visualize/.env
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 15s
    volumes:
      - "D:/Miltiadis/Database/visualize/plots:/app/plots"
      - "D:/Miltiadis/Database/visualize/logs:/app/logs"
    networks:
      - gotti-net

  # ── 5. Gotti Frontend (Next.js Client Dashboard) ────────────────────────────
  gotti-frontend:
    build:
      context: ../gotti-frontend/my-app
      dockerfile: Dockerfile
    container_name: gotti-frontend-app
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:10000/api
      NEXT_PUBLIC_BACKEND_URL: http://localhost:10000
    depends_on:
      - gotti-backend
    networks:
      - gotti-net

networks:
  gotti-net:
    driver: bridge
