# ═══════════════════════════════════════════════════════════════
# Gotti Ecosystem — Shared Local Docker Compose
# ---------------------------------------------------------------
# Prerequisites (vanilla PC):
#   1. Install Docker Desktop for Windows
#   2. Clone both repos side-by-side into the same parent folder:
#        git clone <gotti-visualize-url>
#        git clone <stock-alchemist-url>
#   3. Copy .env.example → .env and fill in your secrets
#   4. Run from the gotti-visualize/ directory:
#        docker compose up -d --build
# ═══════════════════════════════════════════════════════════════

services:

  # ── Shared MySQL ──────────────────────────────────────────────
  mysql:
    image: mysql:8.0
    container_name: gotti-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-rootpass}
      MYSQL_DATABASE: ${DB_DATABASE:-gotti}
    ports:
      - "127.0.0.1:3306:3306"     # local-only; not exposed externally
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost",
             "-uroot", "-p${DB_PASSWORD:-rootpass}"]
      interval: 20s
      timeout: 10s
      retries: 10
    networks:
      - gotti-net

  # ── Stock Alchemist ───────────────────────────────────────────
  stock-alchemist:
    build:
      context: ../stock-alchemist
      dockerfile: Dockerfile
    container_name: stock-alchemist-app
    restart: unless-stopped
    env_file:
      - .env                        # single shared .env lives in gotti-visualize/
    environment:
      DB_HOST: mysql                # override to point at the container
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "127.0.0.1:8080:8080"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s
    volumes:
      - ../stock-alchemist/database:/app/database
      - ../stock-alchemist/logs:/app/logs
    networks:
      - gotti-net

  # ── Gotti Visualize API ───────────────────────────────────────
  gotti-api:
    build: .
    container_name: gotti-api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DB_HOST: mysql                # same shared MySQL
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    volumes:
      - ./plots:/app/plots
      - ./logs:/app/logs
    networks:
      - gotti-net

# ── Shared network ────────────────────────────────────────────
networks:
  gotti-net:
    driver: bridge

# ── Named volumes ─────────────────────────────────────────────
volumes:
  mysql_data:
    name: gotti-mysql-data          # stable name survives `docker compose down`
